name: Scrape Adrian Chiles articles

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # every Monday at 06:00 UTC

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: |
          if [ -n "$GUARDIAN_API_KEY" ]; then
            python scrape.py --api-key "$GUARDIAN_API_KEY" --output titles.txt
          else
            python scrape.py --output titles.txt
          fi

      - name: Upload titles
        uses: actions/upload-artifact@v4
        with:
          name: adrian-chiles-titles
          path: titles.txt
          retention-days: 90

      - name: Commit titles
        run: |
          # Don't replace the list with a shorter one (e.g. a partial API response)
          old=$(git show HEAD:titles.txt | wc -l)
          new=$(wc -l < titles.txt)
          if [ "$new" -lt "$old" ]; then
            echo "Scraped $new titles, fewer than the $old committed; not committing"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add titles.txt
          git diff --staged --quiet || git commit -m "chore: update scraped titles [skip ci]"
          git push
